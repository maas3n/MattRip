name: Android / ChromeOS Play bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name matching the unified product release (for example 1.4.0)'
        required: true
        type: string
      version_code:
        description: 'Monotonically increasing Android versionCode'
        required: true
        type: string

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    environment: android-play
    env:
      FFMPEG_VERSION: '9.0.1'
      ANDROID_NDK_VERSION: '30.0.16248370'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.version_name }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo 'Invalid version_name' >&2
            exit 1
          }
          [[ '${{ inputs.version_code }}' =~ ^[1-9][0-9]*$ ]] || {
            echo 'version_code must be a positive integer' >&2
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build binutils curl patchelf xz-utils autoconf automake libtool pkg-config
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require Play upload signing secrets and certificate pin
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_UPLOAD_KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_UPLOAD_STORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_UPLOAD_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_UPLOAD_KEY_PASSWORD' >&2; exit 1; }
          test -n "$CERT_SHA256" || { echo 'Missing Actions variable ANDROID_UPLOAD_CERT_SHA256' >&2; exit 1; }

      - name: Prepare and verify Play upload identity
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          MATTRIP_SIGNING_KEYSTORE: ${{ runner.temp }}/mattrip-upload.jks
          MATTRIP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MATTRIP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          MATTRIP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MATTRIP_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$MATTRIP_SIGNING_KEYSTORE"
          bash scripts/android-signing-preflight.sh "MattRip Play upload key"

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          # Keep the Play-distributed bundle CSS-free until the separate Play
          # policy/distribution review is completed. Direct GitHub Android
          # builds exercise the CSS-capable JNI path.
          MATTRIP_ANDROID_CSS=0 \
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test, lint and build signed bundle
        env:
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_STORE_FILE: ${{ runner.temp }}/mattrip-upload.jks
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle -p android \
            -PMATTRIP_VERSION_NAME='${{ inputs.version_name }}' \
            -PMATTRIP_VERSION_CODE='${{ inputs.version_code }}' \
            -PMATTRIP_REQUIRE_SIGNING=true \
            :app:testDebugUnitTest :app:lintRelease :app:bundleRelease

      - name: Verify signed AAB
        run: |
          set -euo pipefail
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB"
          python3 android/native/verify-package.py "$AAB"
          jarsigner -verify -certs "$AAB" 2>&1 | tee /tmp/jarsigner.txt
          grep -Fq 'jar verified.' /tmp/jarsigner.txt
          bash scripts/verify-android-signing-cert.sh "$AAB" '${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}'
          unzip -l "$AAB" 'base/lib/arm64-v8a/libmattmux_jni.so' | grep -q libmattmux_jni.so
          unzip -l "$AAB" 'base/lib/x86_64/libmattmux_jni.so' | grep -q libmattmux_jni.so

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: MattRip-${{ inputs.version_name }}-Android-ChromeOS-Play-AAB
          if-no-files-found: error
          path: android/app/build/outputs/bundle/release/*.aab
