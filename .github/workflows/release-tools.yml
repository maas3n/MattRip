name: Release workflow regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publication failure paths and Android upgrade ordering
        run: python3 -m unittest discover -s scripts -p test_release_tools.py -v
      - name: Test Android startup and bounded system-crash recovery
        run: python3 -m unittest discover -s android/scripts -p 'test_startup*.py' -v
