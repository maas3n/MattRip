name: Android / ChromeOS

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-startup.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/android-play.yml'
      - '.github/workflows/android-signing-check.yml'
      - 'scripts/android-signing-*.sh'
      - 'scripts/verify-android-signing-cert.sh'
      - 'scripts/test-android-signing-tools.sh'
      - 'scripts/test-android-gradle-signing.sh'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'
  MATTRIP_CI_VERSION_NAME: '0.0.0-dev'
  MATTRIP_CI_VERSION_CODE: '1'

jobs:
  startup:
    needs: build
    uses: ./.github/workflows/android-startup.yml
    with:
      artifact: MattRip-Android-ChromeOS-dev

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Android signing safeguards with throwaway key
        run: bash scripts/test-android-signing-tools.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg dvdauthor genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test fail-closed Gradle release signing
        run: bash scripts/test-android-gradle-signing.sh

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test UDF reads and production JNI remux parity
        run: |
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"
          bash android/native/tests/test-title-selection.sh "$PWD/android/native/.work" "$RUNNER_TEMP/title-selection"

      - name: Upload remux parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remux-parity-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/remux-parity/*.fingerprint.json

      - name: Include native demux smoke fixtures in development APK only
        run: |
          mkdir -p android/app/src/debug/assets/demux-smoke
          cp "$RUNNER_TEMP/remux-parity/merger/"{mixed,subtitles,raw-h264}.mkv android/app/src/debug/assets/demux-smoke/
          python3 android/native/tests/make-dvd-demux-fixture.py "$RUNNER_TEMP/dvd-demux"
          cp -r "$RUNNER_TEMP/dvd-demux/dvd/VIDEO_TS" android/app/src/debug/assets/demux-smoke/
          cp -r "$RUNNER_TEMP/dvd-demux/clock-reset/VIDEO_TS" android/app/src/debug/assets/demux-smoke/CLOCK_RESET

      - name: Test, lint and build development artifacts
        run: |
          gradle -p android \
            -PMATTRIP_VERSION_NAME="${MATTRIP_CI_VERSION_NAME}" \
            -PMATTRIP_VERSION_CODE="${MATTRIP_CI_VERSION_CODE}" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Verify bundled native libraries and development version
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "${APK}"
          test -n "${AAB}"

          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}")"
          grep -Fq "versionCode='${MATTRIP_CI_VERSION_CODE}'" <<<"${BADGING}"
          grep -Fq "versionName='${MATTRIP_CI_VERSION_NAME}'" <<<"${BADGING}"

          python3 android/native/verify-package.py "${APK}" "${AAB}"

          unzip -p "${APK}" assets/ffmpeg/ffmpeg-build-info.txt \
            | grep -q 'FFmpeg version: 9.0.1'

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 "${APK}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MattRip-Android-ChromeOS-dev
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt
