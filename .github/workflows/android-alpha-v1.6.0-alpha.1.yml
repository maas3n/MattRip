name: Android Alpha Release

on:
  push:
    branches:
      - 'release/android-v1.6.0-alpha.1'
    paths:
      - '.github/workflows/android-alpha-v1.6.0-alpha.1.yml'

permissions:
  contents: read

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'
  MATTRIP_ALPHA_VERSION: '1.6.0-alpha.1'
  MATTRIP_ALPHA_TAG: 'v1.6.0-alpha.1'
  MATTRIP_ALPHA_VERSION_CODE: '10600001'
  MATTRIP_ALPHA_PACKAGE: 'io.github.maas3n.mattrip.alpha'
  MATTRIP_TARGET_SHA: 'ba7883bd67c01a5804b6ced7d84892d85e4b0627'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MATTRIP_TARGET_SHA }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake meson ninja-build binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg dvdauthor genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Configure isolated Alpha application identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          old = 'applicationId = "io.github.maas3n.mattrip"'
          new = 'applicationId = "io.github.maas3n.mattrip.alpha"'
          if old not in text:
              raise SystemExit("Expected production applicationId declaration not found")
          gradle.write_text(text.replace(old, new, 1))

          strings = Path("android/app/src/main/res/values/strings.xml")
          text = strings.read_text()
          old = '<string name="app_name">MattRip</string>'
          new = '<string name="app_name">MattRip Alpha</string>'
          if old not in text:
              raise SystemExit("Expected app_name declaration not found")
          strings.write_text(text.replace(old, new, 1))
          PY

      - name: Build bundled CSS-capable FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Run libdvdcss callback sanitizer regression
        run: |
          set -euo pipefail
          LIBDVDCSS_PREFIX="$RUNNER_TEMP/host-libdvdcss" \
            LIBDVDCSS_WORK="$RUNNER_TEMP/host-libdvdcss-work" \
            bash scripts/build-libdvdcss.sh
          bash android/native/tests/test-dvdcss-stream.sh \
            "$RUNNER_TEMP/host-libdvdcss" \
            "$RUNNER_TEMP/css-callbacks"

      - name: Test UDF and CSS-enabled production JNI parity
        run: |
          set -euo pipefail
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh \
            "$PWD/android/native/.work/libudfread" \
            "$RUNNER_TEMP/remux-parity"
          CSS_LIBDVDCSS_PREFIX="$RUNNER_TEMP/host-libdvdcss" \
            bash android/native/tests/test-host-remux.sh \
              "$PWD/android/native/.work/libudfread" \
              "$RUNNER_TEMP/remux-parity-css"
          bash android/native/tests/test-title-selection.sh \
            "$PWD/android/native/.work" \
            "$RUNNER_TEMP/title-selection"

      - name: Test, lint and build unsigned Alpha APK
        run: |
          gradle -p android \
            -PMATTRIP_VERSION_NAME="${MATTRIP_ALPHA_VERSION}" \
            -PMATTRIP_VERSION_CODE="${MATTRIP_ALPHA_VERSION_CODE}" \
            -PMATTRIP_REQUIRE_SIGNING=false \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Test-sign isolated Alpha APK
        run: |
          set -euo pipefail
          mkdir -p dist/android-alpha
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$UNSIGNED"
          ALIGNED="$RUNNER_TEMP/mattrip-alpha-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/mattrip-alpha-test.jks"
          PASSWORD='mattrip-alpha-test-only'

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias mattrip-alpha \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname 'CN=MattRip Android Alpha Test,O=MattRip Test Builds,C=NO' \
            -noprompt

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" \
            -f -P 16 -v 4 "$UNSIGNED" "$ALIGNED"

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias mattrip-alpha \
            --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" \
            --out "dist/android-alpha/MattRip-${MATTRIP_ALPHA_VERSION}-Android.apk" \
            "$ALIGNED"

      - name: Verify Alpha APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/android-alpha/MattRip-${MATTRIP_ALPHA_VERSION}-Android.apk"
          test -s "$APK"

          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='${MATTRIP_ALPHA_PACKAGE}'" <<<"$BADGING"
          grep -Fq "versionCode='${MATTRIP_ALPHA_VERSION_CODE}'" <<<"$BADGING"
          grep -Fq "versionName='${MATTRIP_ALPHA_VERSION}'" <<<"$BADGING"
          grep -Fq "application-label:'MattRip Alpha'" <<<"$BADGING"

          python3 android/native/verify-package.py "$APK"
          build_info="$(unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt)"
          grep -q 'FFmpeg version: 9.0.1' <<<"$build_info"
          grep -q 'CSS support: libdvdcss 1.6.0' <<<"$build_info"

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$APK" | tee dist/android-alpha/Alpha-signing-certificate.txt
          grep -Fq 'CN=MattRip Android Alpha Test' dist/android-alpha/Alpha-signing-certificate.txt

      - name: Prepare Android Alpha release payload
        run: |
          set -euo pipefail
          cp "android/native/.work/ffmpeg-${FFMPEG_VERSION}.tar.xz" "dist/android-alpha/FFmpeg-${FFMPEG_VERSION}-source.tar.xz"
          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/android-alpha/
          cp android/native/.work/MediaInfoLib-source.tar.gz android/native/.work/ZenLib-source.tar.gz dist/android-alpha/
          cp android/app/src/main/assets/ffmpeg/*-License.* dist/android-alpha/
          cp android/app/src/main/assets/ffmpeg/NDK-NOTICE.txt dist/android-alpha/
          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/android-alpha/
          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt dist/android-alpha/FFmpeg-build-info.txt
          cp android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 dist/android-alpha/COPYING.LGPLv2.1.txt
          cp android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md dist/android-alpha/
          cp THIRD_PARTY.md "dist/android-alpha/MattRip-${MATTRIP_ALPHA_VERSION}-THIRD-PARTY.md"
          (
            cd dist/android-alpha
            sha256sum ./* > SHA256SUMS-Android.txt
          )

      - name: Upload Android Alpha payload
        uses: actions/upload-artifact@v4
        with:
          name: release-android-alpha
          if-no-files-found: error
          path: dist/android-alpha/*

  startup:
    needs: build
    uses: ./.github/workflows/android-startup.yml
    with:
      artifact: release-android-alpha
      source-ref: release/android-v1.6.0-alpha.1

  publish:
    needs: [build, startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.MATTRIP_TARGET_SHA }}

      - name: Download Android Alpha payload
        uses: actions/download-artifact@v4
        with:
          name: release-android-alpha
          path: release-assets

      - name: Verify payload checksums
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -c SHA256SUMS-Android.txt)
          test -s "release-assets/MattRip-${MATTRIP_ALPHA_VERSION}-Android.apk"

      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${MATTRIP_ALPHA_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${MATTRIP_ALPHA_TAG} already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${MATTRIP_ALPHA_TAG}" >/dev/null 2>&1; then
            echo "Tag ${MATTRIP_ALPHA_TAG} already exists." >&2
            exit 1
          fi

      - name: Write Alpha release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Android Alpha test build

          This is a **public pre-release for testing**, not a stable release and not a Google Play release.

          Installation:
          - The Alpha uses the separate package ID `io.github.maas3n.mattrip.alpha` and appears as **MattRip Alpha**.
          - It can be installed alongside stable MattRip without replacing it.
          - This Alpha is signed with a one-off test certificate because the production Android signing keys are intentionally being configured later.
          - Future Alpha builds may require uninstall/reinstall until a persistent Alpha or production signing identity is configured.

          Highlights:
          - CSS/libdvdcss support is enabled for this direct GitHub Android build.
          - Includes arm64-v8a and x86_64 native runtimes.
          - Android 8.0 / API 26 or newer.
          - The libdvdcss callback memory-safety regression, CSS-enabled native remux parity, APK/package validation, and emulator startup tests must pass before publication.

          Testing focus:
          - DVD folders and ISO images through Android SAF/UDF.
          - CSS-encrypted DVD content, especially remux/demux correctness and seeking.
          - Progress reporting, cancellation, stream selection, chapters, and output integrity.

          Known scope:
          - Android USB optical-drive transport is not included yet.
          - Google Play distribution remains separate and CSS-free pending its own policy/release work.
          - Real encrypted-media coverage still depends on tester feedback with representative discs/images.

          Please report reproducible problems with device model, Android version, input type (VIDEO_TS/ISO), and relevant logs.
          NOTES

      - name: Publish Android Alpha GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${MATTRIP_ALPHA_TAG}" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${MATTRIP_TARGET_SHA}" \
            --title "MattRip ${MATTRIP_ALPHA_VERSION} — Android Alpha" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
